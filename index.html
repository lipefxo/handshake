<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/handshake-fav-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handshake — Proposal Studio for Live Deals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Handshake turns working narrative into live proposal pages with a product-grade presentation layer." />
    <meta property="og:title" content="Handshake — Proposal Studio for Live Deals" />
    <meta property="og:description" content="Write fast, shape the story, and send one durable proposal link instead of a static attachment." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.handshake.design" />
    <meta property="og:site_name" content="Handshake" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.handshake.design" />
    <script>
      (function applyCachedBrandTheme() {
        try {
          var raw = window.localStorage.getItem('handshake:brand-theme-cache');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var bgPrimary = parsed && parsed.colors && parsed.colors.bgPrimary;
          if (typeof bgPrimary !== 'string') return;
          var color = bgPrimary.trim();
          if (!color || color.length > 64) return;

          document.documentElement.style.setProperty('--color-bg-primary', color);
          document.documentElement.style.backgroundColor = color;

          var styleTag = document.createElement('style');
          styleTag.textContent = 'body{background-color:' + color + ';}';
          document.head.appendChild(styleTag);
        } catch {
          // no-op
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

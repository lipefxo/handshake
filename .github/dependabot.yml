version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 10
    groups:
      types:
        patterns:
          - '@types/*'
      eslint:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - typescript-eslint
          - '@typescript-eslint/*'
      low-risk-ui:
        patterns:
          - '@dnd-kit/*'
          - '@hugeicons/*'
          - lucide-react
          - class-variance-authority
          - clsx
          - tailwind-merge
          - tw-animate-css
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'

name: Scheduled Security Audit

on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  npm-audit:
    name: Full NPM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full audit
        run: npm audit --audit-level=moderate --json > audit.json || true

      - name: Open or update audit issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const vulnerabilities = audit.metadata?.vulnerabilities ?? {};
            const total = Object.entries(vulnerabilities)
              .filter(([severity]) => ['moderate', 'high', 'critical'].includes(severity))
              .reduce((sum, [, count]) => sum + count, 0);
            if (total === 0) {
              core.info('No moderate-or-higher vulnerabilities found.');
              return;
            }

            const title = 'Scheduled npm audit found vulnerabilities';
            const body = [
              'The scheduled npm audit found moderate-or-higher vulnerabilities.',
              '',
              'Summary:',
              `- Moderate: ${vulnerabilities.moderate ?? 0}`,
              `- High: ${vulnerabilities.high ?? 0}`,
              `- Critical: ${vulnerabilities.critical ?? 0}`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
